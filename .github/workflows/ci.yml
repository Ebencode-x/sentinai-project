name: SentinAI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # STAGE 1 — Quality Gate (Tests + Coverage)
  # ─────────────────────────────────────────────
  test:
    name: "[ TEST ] pytest + coverage"
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN_SENTINAI: ${{ secrets.GITHUB_TOKEN_SENTINAI }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test + coverage tools
        run: pip install pytest pytest-cov

      - name: Run test suite with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  # ─────────────────────────────────────────────
  # STAGE 2 — Code Standards (Ruff)
  # ─────────────────────────────────────────────
  lint:
    name: "[ LINT ] ruff"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  # ─────────────────────────────────────────────
  # STAGE 3 — Security Scan (Bandit)
  # ─────────────────────────────────────────────
  security:
    name: "[ SECURITY ] bandit static analysis"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit scan
        run: |
          bandit -r src/ \
            -ll \
            --exclude src/tests \
            -f json \
            -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
