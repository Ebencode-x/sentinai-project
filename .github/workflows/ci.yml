name: SentinAI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # STAGE 1 — Quality Gate (Tests + Coverage)
  # ─────────────────────────────────────────────
  test:
    name: "[ TEST ] pytest + coverage"
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinai
          POSTGRES_PASSWORD: sentinai
          POSTGRES_DB: sentinai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinai -d sentinai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GITHUB_TOKEN_SENTINAI: ${{ secrets.GITHUB_TOKEN_SENTINAI }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg2://sentinai:sentinai@localhost:5432/sentinai_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install test + coverage tools
        run: pip install pytest pytest-cov

      - name: Run test suite with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75

      - name: Fresh-start smoke test (empty database, first-run login, restart)
        run: sh scripts/smoke_fresh_start.sh python

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  # ─────────────────────────────────────────────
  # STAGE 2 — Code Standards (Ruff)
  # ─────────────────────────────────────────────
  lint:
    name: "[ LINT ] ruff"
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check . --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  # ─────────────────────────────────────────────
  # STAGE 3 — Security Scan (Bandit)
  # ─────────────────────────────────────────────
  security:
    name: "[ SECURITY ] bandit static analysis"
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit scan
        run: |
          bandit -r src/ \
            -ll \
            --exclude src/tests \
            -f json \
            -o bandit-report.json

      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  # ─────────────────────────────────────────────
  # STAGE 4 — Build & Push Docker Image
  # ─────────────────────────────────────────────
  frontend:
    name: "[ FRONTEND ] eslint + build"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check and build
        run: npm run build

  docker:
    name: "[ DOCKER ] build + push"
    runs-on: ubuntu-24.04
    needs: [test, lint, security, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ebencodex/sentinai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        if: success()
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
