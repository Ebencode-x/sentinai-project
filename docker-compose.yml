services:
  sentinai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinai-agent
    env_file:
      - .env
    environment:
      # Postgres from the postgres service below; accounts live in its named volume.
      DATABASE_URL: postgresql+psycopg2://sentinai:sentinai@postgres:5432/sentinai
    volumes:
      # Mount logs directory - persists outside container
      - ./logs:/app/logs
    ports:
      # The image listens on 7860 inside the container; the API is on localhost:8000.
      - "8000:7860"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:7860/health/live', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      vulnerable-app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: sentinai-postgres
    environment:
      # Local development only. The port is not published to the host.
      POSTGRES_USER: sentinai
      POSTGRES_PASSWORD: sentinai
      POSTGRES_DB: sentinai
    volumes:
      - sentinai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinai -d sentinai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  vulnerable-app:
    build:
      context: ./vulnerable-app
      dockerfile: Dockerfile
    container_name: vulnerable-app
    volumes:
      - ./logs:/app/logs
    ports:
      - "9000:9000"
    restart: unless-stopped

volumes:
  sentinai-pgdata:
