version: "3.9"

services:
  sentinai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinai-agent
    env_file:
      - .env
    volumes:
      # Mount logs directory — persists outside container
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      vulnerable-app:
        condition: service_started

  vulnerable-app:
    build:
      context: ./vulnerable-app
      dockerfile: Dockerfile
    container_name: vulnerable-app
    volumes:
      - ./logs:/app/logs
    ports:
      - "9000:9000"
    restart: unless-stopped
